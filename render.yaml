databases:
  - name: tutrade-db
    databaseName: tutrade
    plan: free

services:
  - type: web
    name: tutrade-api
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutrade-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: tutrade-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: tutrade-db
          property: password
      - key: JWT_SECRET
        generateValue: true
